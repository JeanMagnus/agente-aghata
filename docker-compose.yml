services:
  postgres:
    image: pgvector/pgvector:pg18
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: aghata
    ports:
      - "127.0.0.1:5499:5432"
      # - "5499:5432"
    volumes:
      - postgres18_data:/var/lib/postgresql
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  ia-service:
    build:
      context: ./ia-service
      dockerfile: Dockerfile
      target: development
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      DATABASE_VECTOR: postgresql://postgres:postgres@postgres:5432/aghata
    volumes:
      - ./ia-service:/app
      - ia-service-venv:/app/.venv
      - ./docs:/app/docs
    env_file:
      - ./ia-service/.env
    command: ["sh", "-c", "uv sync --locked --no-install-project && uv run uvicorn main:app --host 0.0.0.0 --port 8000 --reload"]
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app-network
    restart: unless-stopped

networks:
  app-network:
    driver: bridge

volumes:
  postgres18_data:
  ia-service-venv: